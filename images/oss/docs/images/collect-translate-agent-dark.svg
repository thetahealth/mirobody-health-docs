<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family='Helvetica, Arial, sans-serif' role="img" aria-label="Collect, Translate, Agent: three stages, left to right">
  <rect width="1120" height="380" fill="#0d1117"/>
  <defs>
    <marker id="raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a8aa0"/>
    </marker>
    <marker id="std" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb96f"/>
    </marker>
  </defs>
  <rect x="40" y="76" width="300" height="240" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="190" y="122" text-anchor="middle" font-size="23" font-weight="bold" fill="#c9d1d9">① Collect</text>
  <text x="190" y="146" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#8b949e">devices · files · exports</text>
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <rect x="94" y="186" width="30" height="40" rx="7"/>
    <path d="M102 186 v-8 h14 v8 M102 226 v8 h14 v-8"/>
    <circle cx="109" cy="206" r="5" fill="#8b949e" stroke="none"/>
    <rect x="175" y="180" width="26" height="52" rx="12"/>
    <path d="M175 210 h26" />
    <rect x="179" y="214" width="18" height="14" rx="6" fill="#8b949e" stroke="none"/>
    <rect x="256" y="180" width="34" height="46" rx="4"/>
    <path d="M264 194 h18 M264 204 h18 M264 214 h11"/>
  </g>
  <text x="190" y="266" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8b949e">the file is kept, and a</text>
  <text x="190" y="284" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8b949e">reading points back to it</text>
  <rect x="410" y="76" width="300" height="240" rx="14" fill="#0e2a19" stroke="#3fb96f" stroke-width="2.5"/>
  <text x="560" y="122" text-anchor="middle" font-size="23" font-weight="bold" fill="#7ee2a8">② Translate</text>
  <text x="560" y="146" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#8b949e">one name, one code, one unit</text>
  <rect x="474" y="176" width="172" height="38" rx="10" fill="#3a2a10" stroke="#d9a24b" stroke-width="1.5"/>
  <text x="560" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#f0c98a">LOINC · UCUM</text>
  <text x="560" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8b949e">offline and deterministic,</text>
  <text x="560" y="262" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8b949e">against a bundle in the package;</text>
  <text x="560" y="284" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8b949e">abstains rather than guesses</text>
  <rect x="780" y="76" width="300" height="240" rx="14" fill="#241832" stroke="#b47ee0" stroke-width="2.5"/>
  <text x="930" y="122" text-anchor="middle" font-size="23" font-weight="bold" fill="#dcb8f5">③ Agent</text>
  <text x="930" y="146" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#8b949e">reads the original documents</text>
  <g stroke="#b47ee0" stroke-width="2" fill="none">
    <path d="M838 176 h64 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-40 l-14 12 v-12 h-10 a8 8 0 0 1 -8 -8 v-26 a8 8 0 0 1 8 -8 z"/>
    <path d="M936 222 l26 -14 l22 8 l30 -30" stroke="#3fb96f" stroke-width="2.5"/>
  </g>
  <circle cx="936" cy="222" r="3.5" fill="#3fb96f"/>
  <circle cx="962" cy="208" r="3.5" fill="#3fb96f"/>
  <circle cx="984" cy="216" r="3.5" fill="#3fb96f"/>
  <circle cx="1014" cy="186" r="3.5" fill="#3fb96f"/>
  <text x="930" y="266" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8b949e">names the file behind</text>
  <text x="930" y="284" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8b949e">a number that came from one</text>
  <path d="M348 196 H400" stroke="#7a8aa0" stroke-width="2.5" fill="none" marker-end="url(#raw)"/>
  <path d="M718 196 H770" stroke="#3fb96f" stroke-width="2.5" fill="none" marker-end="url(#std)"/>
  <text x="560" y="356" text-anchor="middle" font-size="14" fill="#c9d1d9">Whatever the lab called it, in — <tspan font-weight="bold" fill="#3fb96f">one coded record an agent can cite, out.</tspan></text>
</svg>

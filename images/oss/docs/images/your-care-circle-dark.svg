<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family='Helvetica, Arial, sans-serif' role="img" aria-label="How one person reaches another's health record: a request passes resolve_subject, which requires both memberships accepted and the subject's own health_access switch, and either returns access trimmed to the request or raises a 403">
  <rect width="1120" height="400" fill="#0d1117"/>
  <defs>
    <marker id="careq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a8aa0"/>
    </marker>
    <marker id="caok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb96f"/>
    </marker>
    <marker id="cano" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0665a"/>
    </marker>
  </defs>
  <text x="560" y="48" text-anchor="middle" font-size="17" fill="#c9d1d9">Joining a circle is not <tspan font-weight="bold" fill="#f0c98a">being seen.</tspan></text>
  <rect x="40" y="84" width="300" height="240" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="190" y="118" text-anchor="middle" font-size="19" font-weight="bold" fill="#c9d1d9">A request</text>
  <text x="190" y="140" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#8b949e">you → her record</text>
  <g fill="#8b949e" stroke="none">
    <circle cx="118" cy="184" r="13"/>
    <path d="M95 218 a23 17 0 0 1 46 0 z"/>
    <circle cx="262" cy="184" r="13"/>
    <path d="M239 218 a23 17 0 0 1 46 0 z"/>
  </g>
  <path d="M156 196 H220" stroke="#7a8aa0" stroke-width="2" fill="none" marker-end="url(#careq)"/>
  <text x="118" y="244" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#8b949e">operator_id</text>
  <text x="262" y="244" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#8b949e">subject_id</text>
  <text x="190" y="282" text-anchor="middle" font-size="12" font-weight="normal" fill="#c9d1d9">“how has her cholesterol moved?”</text>
  <rect x="400" y="84" width="360" height="240" rx="14" fill="#3a2a10" stroke="#d9a24b" stroke-width="2.5"/>
  <text x="580" y="118" text-anchor="middle" font-size="19" font-weight="bold" fill="#f0c98a">resolve_subject</text>
  <text x="580" y="140" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#8b949e">one authorization throat</text>
  <circle cx="434" cy="174" r="9" fill="#d9a24b"/>
  <text x="434" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a2a10">1</text>
  <text x="454" y="171" text-anchor="start" font-size="12.5" font-weight="bold" fill="#c9d1d9">Both of you accepted</text>
  <text x="454" y="187" text-anchor="start" font-size="10.5" font-weight="normal" fill="#8b949e">status = accepted, on both rows</text>
  <circle cx="434" cy="220" r="9" fill="#d9a24b"/>
  <text x="434" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a2a10">2</text>
  <text x="454" y="217" text-anchor="start" font-size="12.5" font-weight="bold" fill="#c9d1d9">The switch is hers</text>
  <text x="454" y="233" text-anchor="start" font-size="10.5" font-weight="normal" fill="#8b949e">health_access starts at 0</text>
  <circle cx="434" cy="266" r="9" fill="#d9a24b"/>
  <text x="434" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a2a10">3</text>
  <text x="454" y="263" text-anchor="start" font-size="12.5" font-weight="bold" fill="#c9d1d9">Seeing is not editing</text>
  <text x="454" y="279" text-anchor="start" font-size="10.5" font-weight="normal" fill="#8b949e">health_access 1 reads, 2 writes</text>
  <rect x="820" y="98" width="260" height="90" rx="12" fill="#0e2a19" stroke="#3fb96f" stroke-width="2"/>
  <text x="950" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#7ee2a8">Read-only access</text>
  <text x="950" y="149" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#8b949e">trimmed to what was asked</text>
  <text x="950" y="170" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#7ee2a8">Subject(access=view)</text>
  <rect x="820" y="220" width="260" height="90" rx="12" fill="#2d1512" stroke="#e0665a" stroke-width="2"/>
  <text x="950" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#f2a79d">Refused</text>
  <text x="950" y="271" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#8b949e">raised, not returned → 403</text>
  <text x="950" y="292" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#f2a79d">CareCircleDenied</text>
  <path d="M348 204 H390" stroke="#7a8aa0" stroke-width="2.5" fill="none" marker-end="url(#careq)"/>
  <path d="M768 204 L809 143" stroke="#3fb96f" stroke-width="2.5" fill="none" marker-end="url(#caok)"/>
  <path d="M768 204 L809 265" stroke="#e0665a" stroke-width="2.5" fill="none" marker-end="url(#cano)"/>
  <text x="560" y="372" text-anchor="middle" font-size="13" fill="#8b949e">Your own record never takes this path: <tspan fill="#c9d1d9">acting on your own data is not proxy access.</tspan></text>
</svg>
